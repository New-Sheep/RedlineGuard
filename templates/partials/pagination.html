{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination meta" aria-label="Pagination" style="margin:1rem 0;display:flex;gap:0.75rem;align-items:center">
  {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}{% if querystring %}&amp;{{ querystring }}{% endif %}">← Prev</a>
  {% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}{% if querystring %}&amp;{{ querystring }}{% endif %}">Next →</a>
  {% endif %}
</nav>
{% endif %}
